[package]
name = "omp-sync-client"
version = "1.0.0"
edition = "2021"
authors = ["yanzhe-Xiao <xyzxyzxyz6688@gmail.com>"]
description = "OMP Multi-Server Config and Skill Bi-directional Sync Client (Windows & Linux/Ubuntu)"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
walkdir = "2.5"
dirs = "5.0"
regex = "1.11"
chrono = "0.4"
crossbeam-channel = "0.5"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
